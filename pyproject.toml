[project]
name = "aws-platform-agent"
version = "0.1.0"
description = "AI-powered data engineering agent for AWS — profiles, discovers, models, transforms, and exposes data products"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.30",
    "strands-agents-tools>=0.1",
    "boto3>=1.35",
    "dbt-postgres>=1.9",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "bedrock-agentcore[ag-ui]>=1.4.7",
    # 001-dsa-agent-integration: thin FastAPI SSE layer in front of Strands agent
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiofiles>=24.1",
    "pydantic>=2.9",
    "python-jose[cryptography]>=3.3",  # Cognito JWT verification
    # 002-dsa-hub-pinnacle: cross-source scratchpad + Iceberg/Glue driver
    "duckdb>=1.1",
    "pyiceberg[glue]>=0.7",
]

[project.optional-dependencies]
agentcore = [
    "bedrock-agentcore[ag-ui]>=0.1",
]
redshift = [
    "redshift_connector>=2.1",
    "dbt-redshift>=1.9",
]
snowflake = [
    "snowflake-connector-python>=3.0",
    "dbt-snowflake>=1.9",
]
iceberg = [
    "dbt-glue>=1.9",
]
databricks = [
    "databricks-sql-connector>=3.0",
]
otel = [
    "strands-agents[otel]>=1.30",
    "aws-opentelemetry-distro>=0.5",
    "opentelemetry-exporter-otlp>=1.20",
]
eval = [
    "bedrock-agentcore-starter-toolkit>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 trips on the FastAPI idiom `param: T = Depends(dep)` which is the
# documented pattern; ignoring globally per the FastAPI upstream guidance.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs a subprocess (Streamlit / dbt) and takes > 5 s — opt-in only",
]
asyncio_mode = "auto"

# T086: mypy strict-mode gating for new modules introduced by
# 001-dsa-agent-integration. Older modules are intentionally not strict yet.
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "platform_agent.api.*",
    "platform_agent.workflow.*",
    "platform_agent.session.*",
    # 002-dsa-hub-pinnacle: new modules added under strict-mode gating
    "platform_agent.workspace.*",
    "platform_agent.provisioning.*",
    "platform_agent.semantic.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
