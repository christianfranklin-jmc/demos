[project]
name = "aws-platform-agent"
version = "0.1.0"
description = "AI-powered data engineering agent for AWS — profiles, discovers, models, transforms, and exposes data products"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.30",
    "strands-agents-tools>=0.1",
    "boto3>=1.35",
    "dbt-postgres>=1.9",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "bedrock-agentcore[ag-ui]>=1.4.7",
]

[project.optional-dependencies]
agentcore = [
    "bedrock-agentcore[ag-ui]>=0.1",
]
redshift = [
    "redshift_connector>=2.1",
    "dbt-redshift>=1.9",
]
snowflake = [
    "snowflake-connector-python>=3.0",
]
databricks = [
    "databricks-sql-connector>=3.0",
]
otel = [
    "strands-agents[otel]>=1.30",
    "aws-opentelemetry-distro>=0.5",
    "opentelemetry-exporter-otlp>=1.20",
]
eval = [
    "bedrock-agentcore-starter-toolkit>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
